<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasha Mois — Голографический вентилятор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 600px; width: 100%; padding: 40px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 26px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .field { margin-bottom: 20px; }
        label { font-weight: bold; color: #667eea; margin-bottom: 8px; display: block; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: #667eea; }
        textarea { min-height: 100px; resize: vertical; font-family: inherit; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .preview { width: 300px; height: 300px; border-radius: 50%; border: 3px dashed #667eea; margin: 20px auto; overflow: hidden; background: #f9f9f9; display: none; }
        .preview video { width: 100%; height: 100%; object-fit: cover; }
        .status { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; display: none; }
        .status.loading { display: block; background: #fff3cd; color: #856404; }
        .status.success { display: block; background: #d4edda; color: #155724; }
        .status.error { display: block; background: #f8d7da; color: #721c24; }
        .download-btn { background: #28a745; margin-top: 15px; display: none; }
        .download-btn:hover { background: #218838; }
        .info { background: #e7f3ff; padding: 12px; border-radius: 8px; font-size: 13px; color: #004085; margin-bottom: 20px; border-left: 4px solid #667eea; }
        .avatar-name { background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-size: 14px; }
        .avatar-name strong { color: #667eea; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Голографический аватар</h1>
        <p class="subtitle">Создайте видео с Sasha Mois для вентилятора CREPESS300</p>
        
        <div class="avatar-name">
            <strong>Аватар:</strong> Sasha Mois (Urban Chic Driver)
        </div>

        <div class="info">
            🔑 Ваш API ключ: sk_V2_hgu_k5MNbCcjuUf_e4du9oL8V8sKvWMnQhpBrEgz92lcozZp
        </div>

        <div class="field">
            <label>Текст для озвучки</label>
            <textarea id="textInput" placeholder="Например: Добро пожаловать на смену! Не забудьте надеть каску и перчатки."></textarea>
        </div>

        <button onclick="generateVideo()" id="generateBtn">Сгенерировать видео</button>

        <div id="status" class="status"></div>

        <div class="preview" id="previewContainer">
            <video id="videoPreview" controls></video>
        </div>

        <button class="download-btn" id="downloadBtn" onclick="downloadVideo()">Скачать MP4 для SD-карты</button>
    </div>

    <script>
        const API_KEY = 'sk_V2_hgu_k5MNbCcjuUf_e4du9oL8V8sKvWMnQhpBrEgz92lcozZp';
        const AVATAR_ID = 'b8702cda44ca4a628558962969025a2b'; // Urban Chic Driver
        const API_BASE = 'https://api.heygen.com';
        let currentVideoId = null;
        let videoUrl = null;

        async function generateVideo() {
            const text = document.getElementById('textInput').value.trim();
            if(!text) {
                showStatus('Введите текст!', 'error');
                return;
            }

            showStatus('Генерируем видео...', 'loading');
            document.getElementById('generateBtn').disabled = true;

            try {
                const response = await fetch(`${API_BASE}/v2/video/generate`, {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        video_inputs: [{
                            character: {
                                type: 'photo_avatar',
                                photo_avatar_id': AVATAR_ID
                            },
                            voice: {
                                type: 'text',
                                input_text: text
                            }
                        }],
                        dimension: {
                            width: 1024,
                            height: 1024
                        },
                        aspect_ratio: '1:1'
                    })
                });

                const data = await response.json();
                console.log('API Response:', data);
                
                if(data.data && data.data.video_id) {
                    currentVideoId = data.data.video_id;
                    showStatus('Видео в обработке... Проверяем статус', 'loading');
                    checkVideoStatus(currentVideoId);
                } else {
                    throw new Error(data.message || JSON.stringify(data));
                }
            } catch(err) {
                console.error('Error:', err);
                showStatus(`Ошибка: ${err.message}`, 'error');
                document.getElementById('generateBtn').disabled = false;
            }
        }

        async function checkVideoStatus(videoId) {
            try {
                const response = await fetch(`${API_BASE}/v1/video_status.get?video_id=${videoId}`, {
                    headers: { 'X-Api-Key': API_KEY }
                });
                const data = await response.json();
                console.log('Status:', data);
                
                if(data.data.status === 'completed') {
                    videoUrl = data.data.video_url;
                    showStatus('✅ Видео готово!', 'success');
                    document.getElementById('videoPreview').src = videoUrl;
                    document.getElementById('previewContainer').style.display = 'block';
                    document.getElementById('downloadBtn').style.display = 'block';
                    document.getElementById('generateBtn').disabled = false;
                } else if(data.data.status === 'failed') {
                    showStatus('❌ Ошибка генерации', 'error');
                    document.getElementById('generateBtn').disabled = false;
                } else {
                    setTimeout(() => checkVideoStatus(videoId), 5000);
                }
            } catch(err) {
                console.error('Status check error:', err);
                showStatus('Ошибка проверки статуса', 'error');
            }
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        async function downloadVideo() {
            if(!videoUrl) return;
            const a = document.createElement('a');
            a.href = videoUrl;
            a.download = `sasha_mois_${Date.now()}.mp4`;
            a.click();
        }
    </script>
</body>
</html"
