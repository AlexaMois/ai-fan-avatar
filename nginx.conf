# nginx.conf - reverse proxy с HTTPS для ai-fan-avatar
# Требования: nginx + certbot (бесплатный TLS через Let's Encrypt)
# Установка: sudo certbot --nginx -d yourdomain.ru

server {
    listen 80;
    server_name yourdomain.ru www.yourdomain.ru;

    # Редирект всего HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.ru www.yourdomain.ru;

    # Пути к сертификатам Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.ru/privkey.pem;

    # Безопасные настройки SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Прокси всех запросов на Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Увеличенный таймаут для /api/download (потоковая загрузка MP4)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Отключаем буферизацию для потоков скачивания
        proxy_buffering off;
    }

    # Защитные заголовки
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}